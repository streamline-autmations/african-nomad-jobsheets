# Render deploy config for the QBD Bridge. This is a sibling web service to the
# existing n8n instance — deliberately its own service (not bolted onto n8n) so
# a bridge restart never disturbs automation workflows, and vice versa.
#
# rootDir points Render at the bridge/ subfolder of the job-sheets repo, so the
# whole monorepo can share one GitHub remote.
services:
  - type: web
    name: an-qbd-bridge
    runtime: node
    plan: starter
    rootDir: bridge
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: QBWC_USERNAME
        sync: false
      - key: QBWC_PASSWORD
        sync: false
      - key: QBD_ITEM_NAME
        value: Job Sheet Line
      - key: QBD_VAT_MODE
        value: line
      - key: QBD_VAT_ITEM_NAME
        value: VAT @ 15%
      - key: QBD_INCOME_ACCOUNT
        value: Sales
      - key: QBD_EXPENSE_ACCOUNT
        value: Job Expenses
